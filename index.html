<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>载送排班系统</title>
<style>
  :root{
    --bg:#FBEBD6;
    --surface:#FFFFFF;
    --border:#F0D6AE;
    --ink:#472B16;
    --ink-muted:#93714E;
    --teal:#D8602A;
    --teal-dark:#A8451B;
    --teal-pale:#FBDFC3;
    --amber:#E7A430;
    --amber-pale:#FCEACA;
    --alert:#C1422E;
    --alert-pale:#FAE1D8;
    --radius:26px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:0 0 60px;}

  /* header / route motif */
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,var(--teal-dark),var(--teal) 60%,var(--amber));
    color:#fff;
    padding:24px 20px 28px;
    border-radius:0 0 34px 34px;
  }
  .hero::before{
    content:"";position:absolute;top:-46px;right:-36px;width:150px;height:150px;
    border-radius:50%;background:rgba(255,255,255,.14);
  }
  .hero::after{
    content:"";position:absolute;bottom:-60px;right:60px;width:100px;height:100px;
    border-radius:50%;background:rgba(255,255,255,.10);
  }
  .hero h1{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:.2px;position:relative;}
  .hero p{margin:0;font-size:13px;opacity:.9;position:relative;}
  .route-line{display:flex;align-items:center;gap:6px;margin-top:14px;opacity:.95;position:relative;}
  .route-line .dot{width:9px;height:9px;border-radius:50%;background:#fff;flex:none;}
  .route-line .seg{flex:1;height:1px;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 11px);}
  .route-line .lbl{font-size:11px;white-space:nowrap;}

  /* tabs */
  .tabs{
    display:flex;gap:8px;padding:16px 14px 0;
    overflow-x:auto;
  }
  .tab-btn{
    flex:none;
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-muted);
    font-size:13px;font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .content{padding:16px 14px 0;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card h2 .badge{
    width:24px;height:24px;border-radius:50%;background:var(--teal-pale);color:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;
  }

  label{display:block;font-size:12.5px;color:var(--ink-muted);margin:12px 0 5px;font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel],input[type=time],input[type=number],select,textarea{
    width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:18px;
    font-size:14.5px;background:#FFFBF5;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff;}
  textarea{resize:vertical;min-height:56px;border-radius:20px;}
  .hint{font-size:12px;color:var(--ink-muted);margin-top:4px;}
  .zone-point{font-size:12px;color:var(--teal-dark);margin-top:4px;background:var(--teal-pale);padding:8px 12px;border-radius:14px;display:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .check-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .check-row input{width:auto;}
  .check-row span{font-size:13.5px;font-weight:600;}
  .zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
  .zone-chip{
    border:1px solid var(--border);border-radius:16px;padding:9px 12px;font-size:13px;
    display:flex;align-items:center;gap:7px;cursor:pointer;background:#FFFBF5;
  }
  .zone-chip input{width:auto;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--teal);color:#fff;border:none;border-radius:999px;
    padding:13px 18px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;margin-top:16px;
  }
  .btn:active{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--alert);border:1px solid var(--alert-pale);width:auto;padding:7px 14px;font-size:12px;margin-top:0;}
  .btn-secondary{background:var(--surface);color:var(--teal-dark);border:1px solid var(--teal);}

  .banner{border-radius:16px;padding:11px 14px;font-size:13px;margin-top:12px;}
  .banner-ok{background:var(--teal-pale);color:var(--teal-dark);}
  .banner-warn{background:var(--amber-pale);color:#8A5A16;}
  .banner-alert{background:var(--alert-pale);color:var(--alert);}

  /* schedule */
  .event-select{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .event-select select{flex:1;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 6px;text-align:center;}
  .stat b{display:block;font-size:18px;color:var(--teal-dark);}
  .stat span{font-size:10.5px;color:var(--ink-muted);}

  .section-title{font-size:14px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .line{flex:1;height:1px;background:var(--border);}

  .trip-card{border:1px solid var(--border);border-radius:22px;padding:14px 16px;margin-bottom:10px;background:var(--surface);}
  .trip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .trip-time{font-size:20px;font-weight:800;color:var(--teal-dark);line-height:1;}
  .trip-zone{font-size:13px;font-weight:700;margin-top:2px;}
  .trip-point{font-size:11.5px;color:var(--ink-muted);}
  .trip-badge{background:var(--amber-pale);color:#8A5A16;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .trip-driver{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .trip-driver-name{font-size:14.5px;font-weight:800;color:var(--ink);}
  .trip-driver-meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .trip-driver-call{color:var(--teal-dark);font-weight:700;text-decoration:none;font-size:12.5px;background:var(--teal-pale);padding:7px 13px;border-radius:999px;white-space:nowrap;}
  .stop-badge{width:22px;height:22px;border-radius:50%;background:var(--amber-pale);color:#8A5A16;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;}
  .type-badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;background:var(--amber-pale);color:#8A5A16;padding:3px 9px;border-radius:999px;vertical-align:middle;}
  .plate-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1.5px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:7px;text-transform:uppercase;}
  .stop-time{font-size:13px;font-weight:800;color:var(--teal-dark);}
  .eta-line{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--ink-muted);text-align:center;}
  .pax-list{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;}
  .pax-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;}
  .pax-row a{color:var(--teal-dark);text-decoration:none;font-size:11.5px;font-weight:700;}
  .delayed{color:var(--amber);font-weight:700;}

  .unassigned-card{border:1px solid #F0C3AE;background:var(--alert-pale);border-radius:22px;padding:14px 16px;margin-bottom:8px;}
  .unassigned-card b{font-size:13.5px;}
  .unassigned-card .meta{font-size:12px;color:#8A3018;margin-top:2px;}

  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .meta{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .empty{text-align:center;color:var(--ink-muted);font-size:13px;padding:24px 10px;}
  .updated-at{text-align:center;font-size:11px;color:var(--ink-muted);margin-top:8px;}
</style>
</head>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

/* ================= FIREBASE CONFIG =================
   把下面这几个值换成你自己 Firebase 专案的设定（在 Firebase 控制台 
   专案设定 > 一般 > 你的应用程式 那边可以复制到）*/
const firebaseConfig = {
  apiKey: "AIzaSyBdbw2lCoffllWH8GchUblqkMXE-gLGplk",
  authDomain: "church-transportation-form.firebaseapp.com",
  projectId: "church-transportation-form",
  storageBucket: "church-transportation-form.firebasestorage.app",
  messagingSenderId: "691847445926",
  appId: "1:691847445926:web:8d44b2961d7ab82e2f2367"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ================= CONFIG ================= */
const ZONES = [
  {id:'z1', label:'Dahlia／Sakura／Allamanda', point:'集合点：Dahlia Busstop', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Dahlia Busstop')},
  {id:'z2', label:'Cempaka', point:'集合点：Cempaka Office 前', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Cempaka College')},
  {id:'z7', label:'BRC／TAZ', point:'集合点：BRC 布告栏', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS BRC TAZ Samarahan')},
  {id:'z4', label:'Unijaya', point:'集合点：Unijaya Roundabout', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Unijaya Samarahan roundabout')},
  {id:'z5', label:"D'Millenia", point:"集合点：D'Millenia 楼下", driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("D'Millenia Samarahan")},
  {id:'z11', label:'Kenanga', point:'集合点：Kenanga（详细位置请补充）', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Kenanga Samarahan')},
  {id:'z12', label:'Academia 门口', point:'集合点：Academia 门口', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Academia Samarahan')},
  {id:'z13', label:'Seroja', point:'集合点：Seroja（详细位置请补充）', driveMinFromChurch:10, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Seroja Samarahan')},
  {id:'z3', label:'Rafflesia', point:'集合点：另行安排（请见备注或询问同工）', driveMinFromChurch:15, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('UNIMAS Rafflesia College')},
  {id:'z8', label:'IPG Gazebo', point:'集合点：IPG Gazebo', driveMinFromChurch:15, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('IPG Samarahan Gazebo')},
  {id:'z10', label:'Eduvista', point:'集合点：Eduvista 楼下', driveMinFromChurch:15, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Eduvista Samarahan')},
  {id:'z9', label:'IMAS-Appartment', point:'集合点：IMAS-Appartment 楼下', driveMinFromChurch:15, mapLink:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('IMAS Apartment Samarahan')},
  {id:'z6', label:'其他／特殊安排', point:'请在备注注明详细地点', driveMinFromChurch:10, mapLink:''},
];
// Rough drive-time model: the campus-cluster zones (z1,z2,z7,z4,z5,z11,z12,z13)
// sit close together — a few minutes apart by road. z3/z8/z9/z10 (Rafflesia,
// IPG, IMAS-Appartment, Eduvista) are a separate, farther cluster. z6 (other)
// is unknown, so it's not treated as "nearby" for hop purposes. These are
// estimates, not real routing — nudge driveMinFromChurch above or the
// constants below if they're off.
const NEARBY_CLUSTER = ['z1','z2','z7','z4','z5','z11','z12','z13'];
const NEARBY_HOP_MIN = 5;
const FAR_HOP_MIN = 15;
function hopMinutes(zoneIdA, zoneIdB){
  const bothNearby = NEARBY_CLUSTER.includes(zoneIdA) && NEARBY_CLUSTER.includes(zoneIdB);
  return bothNearby ? NEARBY_HOP_MIN : FAR_HOP_MIN;
}
const TURNAROUND_MIN = 30;
const BATCH_WINDOW_MIN = 15;
// Cempaka has two actual meetup spots; which one to use depends on what
// else is on the same trip (told to us by someone who knows the routes).
function pointFor(zone, otherZoneIdsInTrip){
  if(zone.id==='z6') return '各自地址（见下方名单）';
  if(zone.id==='z2'){
    if(otherZoneIdsInTrip.includes('z4')) return '集合点：Cempaka Cafe';
    if(otherZoneIdsInTrip.includes('z1')) return '集合点：Cempaka Office 前';
  }
  if(zone.id==='z4'){
    const pairedWithFarZone = otherZoneIdsInTrip.some(zid => !NEARBY_CLUSTER.includes(zid) && zid!=='z6');
    return pairedWithFarZone ? '集合点：UJ MF Store（校外车顺路捎带）' : '集合点：Unijaya Roundabout';
  }
  return zone.point;
}
const ESCALATION_EXTRA_TRIPS = 2;
// The church's own vans — pre-set so drivers pick a plate instead of typing
// it (avoids typos), and capacity auto-fills from here.
const CHURCH_VANS = [
  {plate:'QAA1245M', color:'白色', capacity:9},
  {plate:'QAB7255', color:'白色', capacity:11},
  {plate:'QAK4980', color:'灰色', capacity:10},
  {plate:'QKX1422', color:'灰色', capacity:11},
  {plate:'QCV9471', color:'灰色', capacity:6},
];
/* 管理分页的密码 —— 只有知道这个密码的人才能用「管理」功能。
   建议换成你自己的密码，换完记得也要重新上传到 GitHub。 */
const ADMIN_PIN = "0816";

/* ================= STATE ================= */
let STATE = {
  tab: 'passenger',
  passengers: [],
  drivers: [],
  activeEvents: [],
  eventSettings: {},
  loaded: false,
  lastFetch: null,
  scheduleEvent: null,
  adminEvent: null,
  adminUnlocked: localStorage.getItem('churchRideAdminUnlocked')==='1',
};

/* ================= FIRESTORE HELPERS ================= */
function safeId(str){
  return encodeURIComponent(String(str)).replace(/[^a-zA-Z0-9_-]/g, '_').slice(0,180);
}

function attachListeners(){
  onSnapshot(collection(db,'passengers'), (snap)=>{
    STATE.passengers = snap.docs.map(d=>({...d.data(), id:d.id}));
    STATE.loaded = true;
    STATE.lastFetch = new Date();
    if(STATE.tab==='schedule' || STATE.tab==='admin') renderTab();
  }, (err)=>{ console.error('passengers listener error', err); });

  onSnapshot(collection(db,'drivers'), (snap)=>{
    STATE.drivers = snap.docs.map(d=>({...d.data(), id:d.id}));
    STATE.loaded = true;
    STATE.lastFetch = new Date();
    if(STATE.tab==='schedule' || STATE.tab==='admin') renderTab();
  }, (err)=>{ console.error('drivers listener error', err); });

  onSnapshot(doc(db,'settings','app'), (snap)=>{
    const data = snap.exists() ? snap.data() : {};
    STATE.activeEvents = data.activeEvents || [];
    STATE.eventSettings = data.eventSettings || {};
    STATE.loaded = true;
    STATE.lastFetch = new Date();
    renderTab();
  }, (err)=>{ console.error('settings listener error', err); });
}
function getEventSettings(eventName){
  return STATE.eventSettings[eventName] || {};
}
function getEventDestination(eventName){
  return getEventSettings(eventName).destination || '教会';
}

/* ================= UTIL ================= */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function timeToMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ if(m==null) return ''; m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function zoneById(id){ return ZONES.find(z=>z.id===id); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function telHref(phone){ return 'tel:'+(phone||'').replace(/[^0-9+]/g,''); }
function waHref(phone){
  let d=(phone||'').replace(/[^0-9]/g,'');
  if(d.startsWith('0')) d='60'+d.slice(1);
  else if(!d.startsWith('60')) d='60'+d;
  return 'https://wa.me/'+d;
}
function eventList(){
  const set = new Set();
  STATE.passengers.forEach(p=>set.add(p.event||'(未命名)'));
  STATE.drivers.forEach(d=>set.add(d.event||'(未命名)'));
  STATE.activeEvents.forEach(e=>set.add(e));
  const arr = Array.from(set);
  arr.sort();
  return arr;
}
function shouldEscalate(escalationTimeStr){
  if(!escalationTimeStr) return false;
  const thresh = timeToMin(escalationTimeStr);
  if(thresh==null) return false;
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  return nowMin >= thresh;
}

/* ================= MATCHING ALGORITHM ================= */
function clusterByTime(list, windowMin){
  const sorted = [...list].sort((a,b)=>a._t-b._t);
  const batches=[]; let current=null;
  sorted.forEach(p=>{
    if(current===null || p._t-current.startTime>windowMin){ current={startTime:p._t, items:[p]}; batches.push(current); }
    else current.items.push(p);
  });
  return batches;
}

// Packs each time-batch into as few trips as possible: a single trip can pick
// up from several zones (a "milk run") as long as one driver's capacity and
// zone coverage allow it. Always computed fresh from current data — never
// reuses a previous layout.
function packBatches(batches, availableDrivers, driverState, relaxed, assignments, unassignedOut, direction){
  batches.forEach(batch=>{
    const batchTime = batch.startTime;
    const byZone = {};
    batch.items.forEach(p=>{ (byZone[p.zone] = byZone[p.zone]||[]).push(p); });
    // Sort each zone's queue: people with duty (服事) go first — they need
    // to arrive early to prepare — only for the going direction. Within the
    // same duty status, whoever registered LAST gets pulled in first (gets
    // the earlier trip); registering early is rewarded with a later, more-
    // sleep pickup once a zone needs more than one trip.
    Object.values(byZone).forEach(arr=>arr.sort((a,b)=>{
      if(direction==='going'){
        const dutyDiff = (b.hasDuty?1:0) - (a.hasDuty?1:0);
        if(dutyDiff!==0) return dutyDiff;
      }
      return (b.updatedAt||0)-(a.updatedAt||0);
    }));
    let zoneQueue = ZONES.map(z=>z.id).filter(zid=>byZone[zid]&&byZone[zid].length)
      .map(zid=>({zoneId:zid, items:byZone[zid]}));

    while(true){
      zoneQueue = zoneQueue.filter(zq=>zq.items.length>0);
      if(zoneQueue.length===0) break;

      const capExtra = relaxed ? ESCALATION_EXTRA_TRIPS : 0;
      const canServeSomething = d => d.zones.includes('any') || zoneQueue.some(zq=>d.zones.includes(zq.zoneId));
      const candidates = availableDrivers.filter(d=>
        driverState[d.id].tripsUsed < (d.maxTrips + capExtra) && canServeSomething(d)
      );

      if(candidates.length===0){
        zoneQueue.forEach(zq=>zq.items.forEach(p=>unassignedOut.push({...p, zone:zq.zoneId, requestedTime:minToTime(batchTime)})));
        break;
      }

      candidates.forEach(d=>{
        const st=driverState[d.id];
        d._effTime = st.nextFreeTime===null ? batchTime : Math.max(batchTime, st.nextFreeTime);
      });
      candidates.sort((a,b)=>{
        if(a._effTime!==b._effTime) return a._effTime-b._effTime;
        return b.capacity-a.capacity;
      });
      const driver = candidates[0];
      const st = driverState[driver.id];
      const effectiveTime = driver._effTime;
      const canServeZone = zid => driver.zones.includes('any') || driver.zones.includes(zid);

      let remainingCap = driver.capacity;
      const stops = [];
      for(const zq of zoneQueue){
        if(remainingCap<=0) break;
        if(!canServeZone(zq.zoneId)) continue;
        const take = zq.items.splice(0, remainingCap);
        if(take.length===0) continue;
        remainingCap -= take.length;
        stops.push({zoneId:zq.zoneId, passengers: take.map(p=>({id:p.id, name:p.name, phone:p.phone, notes:p.notes, hasDuty:p.hasDuty, otherAddress:p.otherAddress}))});
      }

      assignments.push({
        driverId:driver.id, driverName:driver.name, driverPhone:driver.phone, driverType:driver.type,
        driverPlate:driver.plate, driverCapacity:driver.capacity, tripIndex: st.tripsUsed+1,
        time: minToTime(effectiveTime), requestedTime: minToTime(batchTime),
        delayedMin: effectiveTime-batchTime, escalated: relaxed,
        stops
      });
      st.tripsUsed += 1;
      st.nextFreeTime = effectiveTime + TURNAROUND_MIN;
    }
  });
}

function matchDirection(passengersAll, driversAll, direction, escalate){
  const needField = direction==='going' ? 'goingNeeded' : 'returnNeeded';
  const timeField = direction==='going' ? 'goingTime' : 'returnTime';
  const availField = direction==='going' ? 'goingAvailable' : 'returnAvailable';

  const passengers = passengersAll
    .filter(p=>p[needField] && p[timeField])
    .map(p=>({...p, _t:timeToMin(p[timeField])}));

  const driverState = {};
  driversAll.forEach(d=>{ driverState[d.id]={tripsUsed:0, nextFreeTime:null}; });
  const availableDrivers = driversAll.filter(d=>d[availField]);

  const assignments = [];
  let unassigned = [];

  const batches = clusterByTime(passengers, BATCH_WINDOW_MIN);
  packBatches(batches, availableDrivers, driverState, false, assignments, unassigned, direction);

  if(escalate && unassigned.length>0){
    const escList = unassigned.map(p=>({...p, _t:timeToMin(p.requestedTime)}));
    const escBatches = clusterByTime(escList, BATCH_WINDOW_MIN);
    const stillUnassigned = [];
    packBatches(escBatches, availableDrivers, driverState, true, assignments, stillUnassigned, direction);
    unassigned = stillUnassigned;
  }

  assignments.forEach(a=>{ a.direction = direction; });
  return {assignments, unassigned};
}

function computeSchedule(passengers, drivers, escalationTime){
  const escalate = shouldEscalate(escalationTime);
  return {
    going: matchDirection(passengers, drivers, 'going', escalate),
    ret: matchDirection(passengers, drivers, 'return', escalate),
    escalateActive: escalate,
  };
}

function renderSchedule(){

  const sel = STATE.scheduleEvent && events.includes(STATE.scheduleEvent) ? STATE.scheduleEvent : (STATE.activeEvents[0] || events[events.length-1] || '');
  STATE.scheduleEvent = sel;

  if(events.length===0){

  }

  const drivers = STATE.drivers.filter(d=>d.event===sel && !d.hidden);
  const settings = getEventSettings(sel);
  const sched = computeSchedule(passengers, drivers, settings.escalationTime);

  const returnNeed = passengers.filter(p=>p.returnNeeded).length;

  if(settings.escalationTime){

      ? `<div class="banner banner-warn">⚡ 已过 ${esc(settings.escalationTime)}，自动加派已启动：车不够时会请司机多跑一趟（不分区域）</div>`
      : `<div class="hint" style="text-align:center;">未到 ${esc(settings.escalationTime)}，暂不自动加派。若有人未安排上车，同工可手动处理</div>`;

      <div class="stat"><b>${passengers.length}</b><span>登记人数</span></div>
      <div class="stat"><b>${drivers.length}</b><span>司机／车辆</span></div>
      <div class="stat"><b>${goingNeed}</b><span>需要去程</span></div>

function renderDirectionBlock(title, result, dest){
  const {assignments, unassigned} = result;
  let html = `<div class="section-title">${title}<div class="line"></div></div>`;
  if(assignments.length===0 && unassigned.length===0){
    html += `<div class="card"><div class="empty">这个方向暂时没有登记</div></div>`;
  }
  assignments.sort((a,b)=> (a.time>b.time?1:-1));
  assignments.forEach(a=>{
    const totalPax = a.stops.reduce((s,st)=>s+st.passengers.length,0);
    const delayTag = a.delayedMin>0 ? `<span class="delayed">（比要求晚 ${a.delayedMin} 分钟）</span>` : '';
    const badgeStyle = a.escalated ? 'background:var(--alert-pale);color:var(--alert);' : '';
    const badgeText = a.escalated ? `⚡加派 · 第${a.tripIndex}趟 · ${totalPax}/${a.driverCapacity}人` : `第${a.tripIndex}趟 · ${totalPax}/${a.driverCapacity}人`;

    // walk the stops in order, estimating each one's arrival time from the
    // previous stop's time plus the estimated drive time between them
    let runningMin = timeToMin(a.time);
    const timedStops = a.stops.map((s, idx)=>{
      if(idx>0) runningMin += hopMinutes(a.stops[idx-1].zoneId, s.zoneId);
      return {...s, estTime: minToTime(runningMin)};
    });

    const stopsHtml = timedStops.map((s,idx)=>{
      const zone = zoneById(s.zoneId);
      const otherZoneIds = timedStops.filter((_,i)=>i!==idx).map(st=>st.zoneId);
      const pointText = zone ? pointFor(zone, otherZoneIds) : '';
      const mapTag = zone && zone.mapLink ? ` · <a href="${zone.mapLink}" target="_blank" style="color:var(--teal-dark);font-weight:700;text-decoration:none;">📍地图</a>` : '';
      return `
      <div style="margin-top:${idx===0?'0':'14px'};padding-top:${idx===0?'0':'14px'};${idx>0?'border-top:1px dashed var(--border);':''}">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="stop-badge">${idx+1}</span>
          <div style="flex:1;">
            <div class="trip-zone">${esc(zone?zone.label:s.zoneId)}（${s.passengers.length}人）</div>
            <div class="trip-point"><span class="stop-time">${s.estTime}</span> 预计到达 · ${esc(pointText)}${mapTag}</div>
          </div>
        </div>
        <div class="pax-list">
          ${s.passengers.map((p,i)=>`
            <div class="pax-row" style="${p.otherAddress?'align-items:flex-start;flex-direction:column;gap:2px;':''}">
              <div style="display:flex;justify-content:space-between;width:100%;">
                <span>${i+1}. ${esc(p.name)}${p.hasDuty?' <span class="type-badge" style="margin-left:4px;">服事</span>':''}</span>
                <a href="${waHref(p.phone)}" target="_blank">WhatsApp ›</a>
              </div>
              ${p.otherAddress ? `<div class="hint" style="margin:0 0 2px 14px;">📍 ${esc(p.otherAddress)}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    let etaLine = '';
    if(a.direction==='going' && timedStops.length>0){
      const lastStop = timedStops[timedStops.length-1];
      const lastZoneConf = zoneById(lastStop.zoneId);
      const arriveMin = timeToMin(lastStop.estTime) + (lastZoneConf?.driveMinFromChurch ?? NEARBY_HOP_MIN);
      etaLine = `<div class="eta-line">🏁 预计 ${minToTime(arriveMin)} 抵达${esc(dest)}</div>`;
    }

    html += `
    <div class="trip-card">
      <div class="trip-top">
        <div class="trip-time">${a.time} ${delayTag}</div>
        <div class="trip-badge" style="${badgeStyle}">${badgeText}</div>
      </div>
      <div class="trip-driver">
        <div>
          <div class="trip-driver-name">🚗 司机：${esc(a.driverName)}<span class="type-badge">${a.driverType==='van'?'福音车':'私家车'}</span> <span class="plate-badge">${esc((a.driverPlate||'未填').toUpperCase())}</span></div>
        </div>
        <a class="trip-driver-call" href="${telHref(a.driverPhone)}">${esc(a.driverPhone)}</a>
      </div>
      ${stopsHtml}
      ${etaLine}
    </div>`;
  });
  if(unassigned.length>0){
    html += `<div class="banner banner-alert" style="margin-bottom:8px;">⚠️ 以下 ${unassigned.length} 人暂时没有车，需要同工手动安排</div>`;
    unassigned.forEach(p=>{
      const zone = zoneById(p.zone);
      const mapTag = zone && zone.mapLink ? ` · <a href="${zone.mapLink}" target="_blank">📍地图</a>` : '';
      html += `
      <div class="unassigned-card">
        <b>${esc(p.name)}</b> · ${esc(p.requestedTime)}
        <div class="meta">${esc(zone?zone.label:p.zone)}${mapTag} · <a href="${waHref(p.phone)}" target="_blank">WhatsApp ›</a></div>
        ${p.otherAddress ? `<div class="meta">📍 ${esc(p.otherAddress)}</div>` : ''}
      </div>`;
    });
  }
  return html;
}
function wireScheduleEvents(){

/* ---- Admin ---- */
function renderAdmin(){

  </div>` : ''}

  ${sel ? `
  <div class="card">
    <h2><span class="badge">🏁</span> 目的地 — ${esc(sel)}</h2>
    <label>这次去程／回程的目的地叫什么？</label>
    <input type="text" id="admin_destination" value="${esc(settings.destination||'教会')}" placeholder="例如：教会、某某营地">
    <div class="hint">大部分时候是「教会」，不用改。如果这场活动的目的地不是教会（比如去营地），在这里改一次，登记表、总表都会自动换成新名字。</div>
    <button class="btn btn-secondary" onclick="adminSaveDestination()">保存目的地</button>
    <div id="admin_dest_msg"></div>
  </div>

  <div class="card">
    <h2><span class="badge">⚡</span> 自动加派设置 — ${esc(sel)}</h2>
    <label>加派门槛时间（可不设）</label>
    <input type="time" id="admin_escalationTime" value="${esc(settings.escalationTime||'')}">
    <div class="hint">过了这个时间，如果还有人没车，系统会自动请已登记的司机多跑一趟（不受他们原本选的区域限制），最多再加 ${ESCALATION_EXTRA_TRIPS} 趟。不设置的话，系统不会自动加派，未安排的人会一直显示在「需要同工手动安排」，要靠同工自己联系多找车。</div>
    <button class="btn btn-secondary" onclick="adminSaveEscalation()">保存加派设置</button>
    <div id="admin_esc_msg"></div>
  </div>

  <div class="card">
    <h2><span class="badge">🕐</span> 去程时间选项 — ${esc(sel)}</h2>
    <div class="hint">乘客登记去程时，只能从下面这些时间里选，不能自己打字乱填。</div>
    ${(settings.goingTimes||[]).length===0 ? '<div class="empty">还没有设定，乘客暂时无法登记去程</div>' : (settings.goingTimes).map(t=>`
      <div class="list-row"><div>${esc(t)}</div><button class="btn btn-ghost" onclick="removeTimeOption('going', decodeURIComponent('${encodeURIComponent(t)}'))">移除</button></div>
    `).join('')}
    <label>加入新时间</label>
    <input type="time" id="admin_new_goingtime">
    <button class="btn btn-secondary" onclick="addTimeOption('going')">加入</button>
    <div id="admin_goingtime_msg"></div>
  </div>

  <div class="card">
    <h2><span class="badge">🕐</span> 回程时间选项 — ${esc(sel)}</h2>
    <div class="hint">乘客登记回程时，只能从下面这些时间里选，不能自己打字乱填。</div>
    ${(settings.returnTimes||[]).length===0 ? '<div class="empty">还没有设定，乘客暂时无法登记回程</div>' : (settings.returnTimes).map(t=>`
      <div class="list-row"><div>${esc(t)}</div><button class="btn btn-ghost" onclick="removeTimeOption('return', decodeURIComponent('${encodeURIComponent(t)}'))">移除</button></div>

    <input type="time" id="admin_new_returntime">

      <div class="list-row">
        <div>

          <div class="meta">${p.goingNeeded?'去 '+esc(p.goingTime):''} ${p.returnNeeded?'　回 '+esc(p.returnTime):''}</div>
        </div>
        <button class="btn btn-ghost" onclick="deleteRecord('passenger','${p.id}')">删除</button>
      </div>`).join('')}

    <div class="section-title">司机（${drivers.length}）<div class="line"></div></div>
    ${drivers.length===0 ? '<div class="empty">没有资料</div>' : drivers.map(d=>`
      <div class="list-row">
        <div>
          <div>${esc(d.name)}（${esc((d.plate||'未填车牌').toUpperCase())}） · ${d.type==='van'?'福音车':'私家车'} · ${d.capacity}位 x${d.maxTrips}趟</div>
          <div class="meta">${d.zones.includes('any')?'不限区域':d.zones.map(z=>zoneById(z)?.label||z).join('、')}</div>
        </div>
        <button class="btn btn-ghost" onclick="deleteRecord('driver','${d.id}')">删除</button>
      </div>`).join('')}

    ${events.length>0 ? `<button class="btn" style="background:var(--alert);margin-top:20px;" onclick="clearEventData()">清除「${esc(sel)}」的所有资料</button>` : ''}
  </div>

  ${sel ? `
  <div class="card">
    <h2><span class="badge">💾</span> 备份资料</h2>
    <div class="hint">建议每次聚会结束后备份一次。这只是让你把目前的资料复制成文字，自己存起来（例如贴到备忘录、发给自己）,不会存到别的地方。</div>
    <button class="btn btn-secondary" onclick="exportBackup()">生成备份文字</button>
    <textarea id="backup_box" readonly style="display:none;margin-top:10px;min-height:140px;font-family:monospace;font-size:11px;"></textarea>
    <button class="btn" id="copyBackupBtn" style="display:none;" onclick="copyBackup()">复制到剪贴板</button>
  </div>` : ''}`;
}
function wireAdminEvents(){
  const sel = document.getElementById('adminEventSel');
  if(sel) sel.onchange = ()=>{ STATE.adminEvent = sel.value; renderTab(); };
}
function unlockAdmin(){
  const val = document.getElementById('admin_pin_input').value;
  if(val === ADMIN_PIN){
    STATE.adminUnlocked = true;
    localStorage.setItem('churchRideAdminUnlocked','1');
    renderTab();
  }else{
    document.getElementById('admin_pin_msg').innerHTML = '<div class="banner banner-alert">密码不对，请再试一次</div>';
  }
}
async function addEvent(){
  const val = document.getElementById('admin_new_event').value.trim();
  const msg = document.getElementById('admin_ev_msg');
  if(!val){ msg.innerHTML = '<div class="banner banner-alert">请输入活动名称</div>'; return; }
  if(STATE.activeEvents.includes(val)){ msg.innerHTML = '<div class="banner banner-alert">这个活动已经开放中了</div>'; return; }
  const newList = [...STATE.activeEvents, val];
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents:newList, eventSettings: STATE.eventSettings||{}}, {merge:true});
    msg.innerHTML = '<div class="banner banner-ok">已开放 ✓</div>';
    document.getElementById('admin_new_event').value = '';
  }catch(e){
    console.error(e);
    msg.innerHTML = '<div class="banner banner-alert">保存失败，请重试</div>';
  }
}
async function closeEvent(name){
  const newList = STATE.activeEvents.filter(e=>e!==name);
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents:newList, eventSettings: STATE.eventSettings||{}}, {merge:true});
  }catch(e){
    console.error(e);
    alert('操作失败，请重试');
  }
}
async function adminSaveDestination(){
  const val = document.getElementById('admin_destination').value.trim() || '教会';
  const ev = STATE.adminEvent;
  const newSettings = {...STATE.eventSettings, [ev]: {...(STATE.eventSettings[ev]||{}), destination: val}};
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents: STATE.activeEvents, eventSettings: newSettings}, {merge:true});
    document.getElementById('admin_dest_msg').innerHTML = '<div class="banner banner-ok">已保存 ✓</div>';
  }catch(e){
    console.error(e);
    document.getElementById('admin_dest_msg').innerHTML = '<div class="banner banner-alert">保存失败，请重试</div>';
  }
}
async function adminSaveEscalation(){
  const val = document.getElementById('admin_escalationTime').value;
  const ev = STATE.adminEvent;
  const newSettings = {...STATE.eventSettings, [ev]: {...(STATE.eventSettings[ev]||{}), escalationTime: val}};
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents: STATE.activeEvents, eventSettings: newSettings}, {merge:true});
    document.getElementById('admin_esc_msg').innerHTML = '<div class="banner banner-ok">已保存 ✓</div>';
  }catch(e){
    console.error(e);
    document.getElementById('admin_esc_msg').innerHTML = '<div class="banner banner-alert">保存失败，请重试</div>';
  }
}
async function addTimeOption(direction){
  const inputId = direction==='going' ? 'admin_new_goingtime' : 'admin_new_returntime';
  const msgId = direction==='going' ? 'admin_goingtime_msg' : 'admin_returntime_msg';
  const key = direction==='going' ? 'goingTimes' : 'returnTimes';
  const val = document.getElementById(inputId).value;
  const msg = document.getElementById(msgId);
  if(!val){ msg.innerHTML = '<div class="banner banner-alert">请选择时间</div>'; return; }
  const ev = STATE.adminEvent;
  const current = getEventSettings(ev)[key] || [];
  if(current.includes(val)){ msg.innerHTML = '<div class="banner banner-alert">这个时间已经在列表里了</div>'; return; }
  const updated = [...current, val].sort();
  const newSettings = {...STATE.eventSettings, [ev]: {...(STATE.eventSettings[ev]||{}), [key]: updated}};
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents: STATE.activeEvents, eventSettings: newSettings}, {merge:true});
    msg.innerHTML = '<div class="banner banner-ok">已加入 ✓</div>';
  }catch(e){
    console.error(e);
    msg.innerHTML = '<div class="banner banner-alert">保存失败，请重试</div>';
  }
}
async function removeTimeOption(direction, time){
  const key = direction==='going' ? 'goingTimes' : 'returnTimes';
  const ev = STATE.adminEvent;
  const current = getEventSettings(ev)[key] || [];
  const updated = current.filter(t=>t!==time);
  const newSettings = {...STATE.eventSettings, [ev]: {...(STATE.eventSettings[ev]||{}), [key]: updated}};
  try{
    await setDoc(doc(db,'settings','app'), {activeEvents: STATE.activeEvents, eventSettings: newSettings}, {merge:true});
  }catch(e){
    console.error(e);
    alert('操作失败，请重试');
  }
}
async function deleteRecord(kind, id){
  try{
    await setDoc(doc(db, kind==='passenger'?'passengers':'drivers', id), {hidden:true}, {merge:true});
  }catch(e){
    console.error(e);
    alert('删除失败，请重试');
  }
}
async function clearEventData(){
  const ev = STATE.adminEvent;
  if(!confirm('确定要清除「'+ev+'」的所有登记资料吗？这个动作无法恢复。')) return;
  const jobs = [
    ...STATE.passengers.filter(p=>p.event===ev).map(p=>setDoc(doc(db,'passengers',p.id),{hidden:true},{merge:true})),
    ...STATE.drivers.filter(d=>d.event===ev).map(d=>setDoc(doc(db,'drivers',d.id),{hidden:true},{merge:true})),
  ];
  try{
    await Promise.all(jobs);
  }catch(e){
    console.error(e);
    alert('清除过程中发生错误，请重新整理页面确认结果');
  }
}
function exportBackup(){
  const sel = STATE.adminEvent;
  const passengers = STATE.passengers.filter(p=>p.event===sel && !p.hidden);
  const drivers = STATE.drivers.filter(d=>d.event===sel && !d.hidden);
  const data = JSON.stringify({event:sel, exportedAt:new Date().toString(), passengers, drivers}, null, 2);
  const box = document.getElementById('backup_box');
  box.style.display='block';
  box.value = data;
  document.getElementById('copyBackupBtn').style.display='block';
}
async function copyBackup(){
  const box = document.getElementById('backup_box');
  box.select();
  try{
    await navigator.clipboard.writeText(box.value);
    alert('已复制！你可以贴到备忘录或WhatsApp给自己存起来。');
  }catch(e){
    alert('自动复制失败，文字已经帮你全选好了，请手动复制（长按 → 复制）。');
  }
}

/* ================= INIT ================= */
function init(){
  render();
  attachListeners();
  // Firestore listeners fire on data changes, but the escalation threshold
  // depends on wall-clock time, so also re-render periodically while on
  // the schedule tab to keep that comparison current.
  setInterval(()=>{
    if(STATE.tab==='schedule') renderTab();
  }, 30000);
}
init();

/* Inline onclick/onchange attributes run in global scope, but this is a
   module script (needed for the Firebase SDK import), so its functions
   aren't global by default — expose the ones referenced from HTML. */
Object.assign(window, {
  switchTab, showZonePoint, toggleField, submitPassenger, toggleZoneChips,
  submitDriver, manualRefresh, addEvent, closeEvent, adminSaveEscalation, adminSaveDestination,
  deleteRecord, clearEventData, exportBackup, copyBackup, unlockAdmin,
  refreshTimeOptions, addTimeOption, removeTimeOption,
  toggleDriverType, onVanPlateChange, toggleOtherAddress,
});
</script>
